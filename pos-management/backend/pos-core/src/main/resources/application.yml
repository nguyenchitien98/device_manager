spring:
  application:
    name: pos-management-core

  datasource:
    url: jdbc:postgresql://localhost:5432/pos_db
    username: pos_user
    password: pos_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: PosHikariPool

  jpa:
    hibernate:
      ddl-auto: validate           # BẮT BUỘC — KHÔNG dùng create/update. Dùng Flyway!
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 20
    open-in-view: false            # Tắt để tránh LazyInitializationException qua HTTP boundary

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  data:
    redis:
      host: localhost
      port: 6379
      password: pos_redis_password
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true
    consumer:
      group-id: pos-management-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.banking.pos.*"

  security:
    filter:
      order: 10

# ─── JWT Configuration ───────────────────────────────────────────
pos:
  jwt:
    secret: "pos-management-jwt-secret-key-must-be-at-least-256-bits-for-hs256-security"
    access-token-expiry: 900        # 15 phút (giây)
    refresh-token-expiry: 604800    # 7 ngày (giây)

  security:
    rate-limit:
      login-max-attempts: 5
      login-window-seconds: 60
      account-lock-minutes: 30

  outbox:
    polling-delay-ms: 2000          # Poll outbox mỗi 2 giây
    max-retry: 5

# ─── Spring Actuator ─────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true

# ─── OpenAPI / Swagger ───────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# ─── Server ──────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /

# ─── Application Info ────────────────────────────────────────────
app:
  version: 1.0.0

# ─── External Integrations ───────────────────────────────────────
# WAY4 Card Management Platform
pos:
  integration:
    way4:
      enabled: false                              # Tắt khi chưa có WAY4 endpoint thực
      base-url: ${WAY4_BASE_URL:http://localhost:9001/way4-mock}
      api-key: ${WAY4_API_KEY:dev-api-key}
      timeout-ms: 5000
      retry-max-attempts: 3
    t24:
      enabled: false                              # Tắt khi chưa có T24 endpoint thực
      base-url: ${T24_BASE_URL:http://localhost:9002/t24-mock}
      api-key: ${T24_API_KEY:dev-api-key}
      timeout-ms: 5000
      retry-max-attempts: 3

# ─── Logging ─────────────────────────────────────────────────────
logging:
  level:
    com.banking.pos: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: INFO
