<div class="list-page-container">
  <div class="search-zone-card">
    <div class="create-header-row">
      <pos-button variant="ghost" (clicked)="goBack()">← Quay lại danh sách</pos-button>
      <h2>Tạo Phiếu Xuất Kho Thiết Bị POS Mới</h2>
    </div>

    <div class="form-grid">
      <pos-select label="Mục Đích Xuất Kho" selectId="sel-exp-type" [options]="typeOptions" [(ngModel)]="formModel.exportType" />
      <pos-select label="Kho Xuất Hàng" selectId="sel-src-wh" [options]="warehouseOptions" [(ngModel)]="formModel.sourceWarehouse" />
      <pos-input label="Tên Đơn Vị / Merchant Nhận Hàng" inputId="inp-exp-dest" [(ngModel)]="formModel.destinationName" />
      <pos-input type="textarea" label="Ghi Chú Xuất Kho" inputId="inp-exp-note" [(ngModel)]="formModel.note" />
    </div>
  </div>

  <div class="list-zone-card">
    <div class="list-toolbar">
      <div class="toolbar-left">
        <h3 class="list-title">Danh Sách Serial Thiết Bị POS Xuất Kho</h3>
        <pos-badge variant="info">{{ parsedCount() }} thiết bị nhận diện</pos-badge>
      </div>
    </div>

    <div class="serial-entry-area">
      <pos-input
        type="textarea"
        label="Dán danh sách Serial Number Xuất kho (Mỗi Serial một dòng)"
        inputId="inp-serial-exp-lines"
        [rows]="10"
        placeholder="VD:&#10;PAX-A920-998822&#10;PAX-A920-998823"
        [ngModel]="formModel.serialListText"
        (ngModelChange)="formModel.serialListText = $event; onSerialListChange($event)"
      />
    </div>

    <div class="form-actions-bar">
      <pos-button variant="ghost" (clicked)="goBack()">Hủy bỏ</pos-button>
      <pos-button variant="primary" [loading]="saving()" (clicked)="onSubmit()">Lưu & Gửi Duyệt Xuất Kho</pos-button>
    </div>
  </div>
</div>
