<div class="pos-page-container">
  <!-- SEARCH ZONE CARD -->
  <div class="search-zone-card">
    <div class="search-card-header">
      <div class="card-title-group">
        <h3 class="card-title">Bộ Lọc Tìm Kiếm</h3>
      </div>
    </div>

    <div class="search-card-body">
      <div class="filter-grid">
        <pos-input
          inputId="filter-code"
          label="Mã Loại Thiết Bị"
          placeholder="Nhập mã loại (VD: TYPE_ANDROID)..."
          [ngModel]="filterCode()"
          (ngModelChange)="filterCode.set($event)"
          (keydown.enter)="onSearch()">
        </pos-input>

        <pos-input
          inputId="filter-name"
          label="Tên Loại Thiết Bị"
          placeholder="Nhập tên loại..."
          [ngModel]="filterName()"
          (ngModelChange)="filterName.set($event)"
          (keydown.enter)="onSearch()">
        </pos-input>

        <pos-select
          selectId="filter-category"
          label="Danh Mục Thiết Bị"
          [options]="categoryOptions"
          [ngModel]="selectedCategory()"
          (ngModelChange)="selectedCategory.set($event)">
        </pos-select>
      </div>

      <div class="filter-actions-right">
        <pos-button btnId="btn-export-excel" variant="ghost" (clicked)="onExportExcel()">📊 Xuất Excel</pos-button>
        <pos-button btnId="btn-reset" variant="ghost" (clicked)="onReset()">🔄 Xóa bộ lọc</pos-button>
        <pos-button btnId="btn-search" variant="primary" (clicked)="onSearch()">🔍 Tìm kiếm</pos-button>
      </div>
    </div>
  </div>

  <!-- LIST ZONE CARD -->
  <div class="list-zone-card">
    <div class="list-card-header">
      <div class="card-title-group">
        <h3 class="card-title">Danh Sách Loại Thiết Bị</h3>
        <pos-badge variant="info" class="count-badge">{{ filteredTypes().length }} loại thiết bị</pos-badge>
      </div>

      <div class="card-header-actions">
        <pos-dropdown buttonVariant="ghost" [autoClose]="false" [items]="columnToggleItems()" (itemClick)="toggleColumn($event)">
          <span class="col-toggle-btn">👁️ Hiển thị cột</span>
        </pos-dropdown>

        <pos-button btnId="btn-create-type" variant="primary" (clicked)="openCreateModal()">
          ➕ Thêm loại thiết bị mới
        </pos-button>
      </div>
    </div>

    <div class="list-card-body p-0">
      <pos-table
        [columns]="visibleColumns()"
        [data]="filteredTypes()"
        [loading]="loading()"
        [sortField]="sortField()"
        [sortOrder]="sortOrder()"
        (sortChange)="onSortChange($event)">
        <ng-template #cellTemplate let-item let-field="field">
          <ng-container [ngSwitch]="field">
            <span *ngSwitchCase="'code'" class="font-mono text-primary font-bold">
              {{ item.code }}
            </span>
            <span *ngSwitchCase="'status'">
              <pos-badge [variant]="item.status === 'ACTIVE' ? 'success' : 'danger'">
                {{ item.status === 'ACTIVE' ? 'Hoạt động' : 'Ngừng hoạt động' }}
              </pos-badge>
            </span>
            <span *ngSwitchCase="'actions'" class="action-btn-group">
              <pos-button variant="warning" size="xs" [pill]="true" (clicked)="openEditModal(item)">
                ✏️ Sửa
              </pos-button>
              <pos-button variant="danger" size="xs" [pill]="true" (clicked)="selectedItem.set(item); showDeleteConfirm.set(true)">
                🗑️ Xóa
              </pos-button>
            </span>
            <span *ngSwitchDefault>{{ item[field] }}</span>
          </ng-container>
        </ng-template>
      </pos-table>
    </div>

    <div class="list-card-footer">
      <pos-pagination
        [totalItems]="totalItems()"
        [pageSize]="pageSize()"
        [currentPage]="currentPage()"
        (pageChange)="currentPage.set($event); loadData()"
        (pageSizeChange)="onPageSizeChange($event)">
      </pos-pagination>
    </div>

  </div>

  <!-- Create / Edit Modal -->
  <pos-modal [isOpen]="showModal()" [title]="modalTitle()" size="md" (closed)="showModal.set(false)">
    <div class="modal-form-grid">
      <pos-input inputId="form-code" label="Mã Loại" placeholder="VD: TYPE_ANDROID_HANDHELD" [required]="true" [ngModel]="formModel.code" (ngModelChange)="formModel.code = $event"></pos-input>
      <pos-input inputId="form-name" label="Tên Loại" placeholder="VD: Smart POS Cầm Tay 4G" [required]="true" [ngModel]="formModel.name" (ngModelChange)="formModel.name = $event"></pos-input>
      <pos-select selectId="form-cat" label="Thuộc Danh Mục" [options]="categoryOptions.slice(1)" [(ngModel)]="formModel.categoryName"></pos-select>
    </div>

    <div class="modal-footer-actions">
      <pos-button btnId="btn-cancel" variant="ghost" (clicked)="showModal.set(false)">Hủy bỏ</pos-button>
      <pos-button btnId="btn-save" variant="primary" [loading]="saving()" (clicked)="onSave()">Lưu thông tin</pos-button>
    </div>
  </pos-modal>

  <!-- Delete Confirm Dialog -->
  <pos-confirm-dialog
    [isOpen]="showDeleteConfirm()"
    title="Xóa Loại Thiết Bị?"
    [message]="'Bạn có chắc chắn muốn xóa loại thiết bị `' + (selectedItem()?.name || '') + '`?'"
    type="danger"
    [loading]="deleting()"
    (confirm)="onConfirmDelete()"
    (cancel)="showDeleteConfirm.set(false)">
  </pos-confirm-dialog>
</div>
