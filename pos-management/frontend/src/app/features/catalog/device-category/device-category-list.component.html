<div class="pos-page-container">
  <!-- SEARCH ZONE CARD -->
  <div class="search-zone-card">
    <div class="search-card-header">
      <div class="card-title-group">
        <h3 class="card-title">Bộ Lọc Tìm Kiếm</h3>
      </div>
    </div>

    <div class="search-card-body">
      <div class="filter-grid">
        <pos-input
          inputId="filter-code"
          label="Mã Danh Mục"
          placeholder="Nhập mã danh mục (VD: POS_ANDROID)..."
          [ngModel]="filterCode()"
          (ngModelChange)="filterCode.set($event)"
          (keydown.enter)="onSearch()">
        </pos-input>

        <pos-input
          inputId="filter-name"
          label="Tên Danh Mục"
          placeholder="Nhập tên danh mục..."
          [ngModel]="filterName()"
          (ngModelChange)="filterName.set($event)"
          (keydown.enter)="onSearch()">
        </pos-input>

        <pos-select
          selectId="filter-status"
          label="Trạng Thái"
          [options]="statusOptions"
          [ngModel]="filterStatus()"
          (ngModelChange)="filterStatus.set($event)">
        </pos-select>

        <pos-input
          inputId="filter-date"
          type="date"
          label="Ngày Tạo"
          [ngModel]="filterDate()"
          (ngModelChange)="filterDate.set($event)">
        </pos-input>
      </div>

      <!-- FILTER ACTIONS RIGHT -->
      <div class="filter-actions-right">
        <pos-button
          btnId="btn-export-excel"
          variant="ghost"
          (clicked)="onExportExcel()">
          📊 Xuất Excel
        </pos-button>

        <pos-button
          btnId="btn-reset"
          variant="ghost"
          (clicked)="onReset()">
          🔄 Xóa bộ lọc
        </pos-button>

        <pos-button
          btnId="btn-search"
          variant="primary"
          (clicked)="onSearch()">
          🔍 Tìm kiếm
        </pos-button>
      </div>
    </div>
  </div>

  <!-- LIST ZONE CARD -->
  <div class="list-zone-card">
    <div class="list-card-header">
      <div class="card-title-group">
        <h3 class="card-title">Danh Sách Danh Mục Thiết Bị</h3>
        <pos-badge variant="info" class="count-badge">{{ filteredCategories().length }} danh mục</pos-badge>
      </div>

      <div class="card-header-actions">
        <!-- Dropdown select Ẩn/Hiển thị cột -->
        <pos-dropdown
          buttonVariant="ghost"
          [autoClose]="false"
          [items]="columnToggleItems()"
          (itemClick)="toggleColumn($event)">
          <span class="col-toggle-btn">👁️ Hiển thị cột</span>
        </pos-dropdown>

        <!-- Button Thêm mới -->
        <pos-button
          btnId="btn-create-category"
          variant="primary"
          (clicked)="openCreateModal()">
          ➕ Thêm danh mục mới
        </pos-button>
      </div>
    </div>

    <div class="list-card-body p-0">
      <pos-table [columns]="visibleColumns()" [data]="filteredCategories()" [loading]="loading()">
        <ng-template #cellTemplate let-item let-field="field">
          <ng-container [ngSwitch]="field">
            <span *ngSwitchCase="'code'" class="font-mono text-primary font-bold">
              {{ item.code }}
            </span>
            <span *ngSwitchCase="'status'">
              <pos-badge [variant]="item.status === 'ACTIVE' ? 'success' : 'danger'">
                {{ item.status === 'ACTIVE' ? 'Hoạt động' : 'Ngừng hoạt động' }}
              </pos-badge>
            </span>
            <span *ngSwitchCase="'actions'">
              <pos-dropdown
                [items]="actionItems"
                (itemClick)="onActionClick(item, $event)">
              </pos-dropdown>
            </span>
            <span *ngSwitchDefault>{{ item[field] }}</span>
          </ng-container>
        </ng-template>
      </pos-table>
    </div>

    <div class="list-card-footer">
      <pos-pagination
        [totalItems]="filteredCategories().length"
        [pageSize]="pageSize()"
        [currentPage]="currentPage()"
        (pageChange)="currentPage.set($event)">
      </pos-pagination>
    </div>
  </div>

  <!-- Create / Edit Modal -->
  <pos-modal
    [isOpen]="showModal()"
    [title]="modalTitle()"
    size="md"
    (closed)="showModal.set(false)">
    <div class="modal-form-grid">
      <pos-input
        inputId="form-code"
        label="Mã Danh Mục"
        placeholder="VD: POS_ANDROID"
        [required]="true"
        [ngModel]="formModel.code"
        (ngModelChange)="formModel.code = $event">
      </pos-input>

      <pos-input
        inputId="form-name"
        label="Tên Danh Mục"
        placeholder="VD: Smart POS Android"
        [required]="true"
        [ngModel]="formModel.name"
        (ngModelChange)="formModel.name = $event">
      </pos-input>

      <pos-select
        selectId="form-status"
        label="Trạng Thái"
        [options]="statusOptions.slice(1)"
        [(ngModel)]="formModel.status">
      </pos-select>

      <div style="grid-column: span 2;">
        <pos-input
          inputId="form-desc"
          type="textarea"
          label="Mô Tả"
          placeholder="Mô tả chi tiết về danh mục..."
          [ngModel]="formModel.description"
          (ngModelChange)="formModel.description = $event">
        </pos-input>
      </div>
    </div>

    <div class="modal-footer-actions">
      <pos-button btnId="btn-cancel" variant="ghost" (clicked)="showModal.set(false)">Hủy bỏ</pos-button>
      <pos-button btnId="btn-save" variant="primary" [loading]="saving()" (clicked)="onSave()">Lưu thông tin</pos-button>
    </div>
  </pos-modal>

  <!-- Delete Confirm Dialog -->
  <pos-confirm-dialog
    [isOpen]="showDeleteConfirm()"
    title="Xóa Danh Mục Thiết Bị?"
    [message]="'Bạn có chắc chắn muốn xóa danh mục `' + (selectedItem()?.name || '') + '`? Hành động này không thể hoàn tác.'"
    type="danger"
    [loading]="deleting()"
    (confirm)="onConfirmDelete()"
    (cancel)="showDeleteConfirm.set(false)">
  </pos-confirm-dialog>
</div>
