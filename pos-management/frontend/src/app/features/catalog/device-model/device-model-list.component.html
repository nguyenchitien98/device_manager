<div class="pos-page-container">
  <!-- SEARCH ZONE CARD -->
  <div class="search-zone-card">
    <div class="search-card-header">
      <div class="card-title-group">
        <h3 class="card-title">Bộ Lọc Tìm Kiếm</h3>
      </div>
    </div>

    <div class="search-card-body">
      <div class="filter-grid">
        <pos-input
          inputId="filter-code"
          label="Mã Model POS"
          placeholder="Nhập mã model (VD: MODEL_A920)..."
          [ngModel]="filterCode()"
          (ngModelChange)="filterCode.set($event)"
          (keydown.enter)="onSearch()">
        </pos-input>

        <pos-input
          inputId="filter-name"
          label="Tên Model POS"
          placeholder="Nhập tên model..."
          [ngModel]="filterName()"
          (ngModelChange)="filterName.set($event)"
          (keydown.enter)="onSearch()">
        </pos-input>

        <pos-select
          selectId="filter-vendor"
          label="Nhà Cung Cấp"
          [options]="vendorOptions"
          [ngModel]="selectedVendor()"
          (ngModelChange)="selectedVendor.set($event)">
        </pos-select>
      </div>

      <div class="filter-actions-right">
        <pos-button btnId="btn-export-excel" variant="secondary" icon="bi bi-file-earmark-excel" (clicked)="onExportExcel()">Xuất Excel</pos-button>
        <pos-button btnId="btn-reset" variant="secondary" icon="bi bi-arrow-counterclockwise" (clicked)="onReset()">Xóa bộ lọc</pos-button>
        <pos-button btnId="btn-search" variant="primary" icon="bi bi-search" (clicked)="onSearch()">Tìm kiếm</pos-button>
      </div>
    </div>
  </div>

  <!-- LIST ZONE CARD -->
  <div class="list-zone-card">
    <div class="list-card-header">
      <div class="card-title-group">
        <h3 class="card-title">Danh Sách Model POS</h3>
        <pos-badge variant="info" class="count-badge">{{ filteredModels().length }} model</pos-badge>
      </div>

      <div class="card-header-actions">
        <pos-dropdown [items]="columnToggleItems()" (itemClick)="toggleColumn($event)">
          <button class="col-toggle-btn" type="button">
            <i class="bi bi-columns-gap"></i>
            <span>Hiển thị cột</span>
          </button>
        </pos-dropdown>

        <pos-button btnId="btn-create-model" variant="primary" icon="bi bi-plus-lg" (clicked)="openCreateModal()">
          Thêm model POS mới
        </pos-button>
      </div>
    </div>

    <div class="list-card-body p-0">
      <pos-table [columns]="visibleColumns()" [data]="filteredModels()" [loading]="loading()">
        <ng-template #cellTemplate let-item let-field="field">
          <ng-container [ngSwitch]="field">
            <span *ngSwitchCase="'code'" class="font-mono text-primary font-bold">
              {{ item.code }}
            </span>
            <span *ngSwitchCase="'status'">
              <pos-badge [variant]="item.status === 'ACTIVE' ? 'success' : 'danger'">
                {{ item.status === 'ACTIVE' ? 'Hoạt động' : 'Ngừng hoạt động' }}
              </pos-badge>
            </span>
            <span *ngSwitchCase="'actions'">
              <pos-dropdown [items]="actionItems" (itemClick)="onActionClick(item, $event)"></pos-dropdown>
            </span>
            <span *ngSwitchDefault>{{ item[field] }}</span>
          </ng-container>
        </ng-template>
      </pos-table>
    </div>

    <div class="list-card-footer">
      <pos-pagination
        [totalItems]="filteredModels().length"
        [pageSize]="pageSize()"
        [currentPage]="currentPage()"
        (pageChange)="currentPage.set($event)">
      </pos-pagination>
    </div>
  </div>

  <!-- Create / Edit Modal -->
  <pos-modal [isOpen]="showModal()" [title]="modalTitle()" size="md" (closed)="showModal.set(false)">
    <div class="modal-form-grid">
      <pos-input inputId="form-code" label="Mã Model" placeholder="VD: MODEL_A920" [required]="true" [ngModel]="formModel.code" (ngModelChange)="formModel.code = $event"></pos-input>
      <pos-input inputId="form-name" label="Tên Model" placeholder="VD: PAX A920 Pro" [required]="true" [ngModel]="formModel.name" (ngModelChange)="formModel.name = $event"></pos-input>
      <pos-select selectId="form-vendor" label="Nhà Cung Cấp" [options]="vendorOptions.slice(1)" [(ngModel)]="formModel.vendorName"></pos-select>
    </div>

    <div class="modal-footer-actions">
      <pos-button btnId="btn-cancel" variant="ghost" (clicked)="showModal.set(false)">Hủy bỏ</pos-button>
      <pos-button btnId="btn-save" variant="primary" [loading]="saving()" (clicked)="onSave()">Lưu thông tin</pos-button>
    </div>
  </pos-modal>

  <!-- Delete Confirm Dialog -->
  <pos-confirm-dialog
    [isOpen]="showDeleteConfirm()"
    title="Xóa Model POS?"
    [message]="'Bạn có chắc chắn muốn xóa model `' + (selectedItem()?.name || '') + '`?'"
    type="danger"
    [loading]="deleting()"
    (confirm)="onConfirmDelete()"
    (cancel)="showDeleteConfirm.set(false)">
  </pos-confirm-dialog>
</div>
