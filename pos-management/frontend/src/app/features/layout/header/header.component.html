<header class="app-header">
  <div class="header-left">
    <!-- Hamburger Toggle Sidebar -->
    <button class="icon-btn" (click)="toggleSidebar.emit()" id="btn-toggle-sidebar" title="Thu/mở sidebar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6"  x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <!-- Brand Header Title -->
    <div class="header-brand">
      <div class="header-logo">
        <svg width="20" height="20" viewBox="0 0 28 28" fill="none">
          <path d="M14 2L3 8.5V11H25V8.5L14 2Z" fill="white"/>
          <rect x="5"  y="13" width="3.5" height="11" rx="0.8" fill="white"/>
          <rect x="10" y="13" width="3.5" height="11" rx="0.8" fill="white"/>
          <rect x="15" y="13" width="3.5" height="11" rx="0.8" fill="white"/>
          <rect x="20" y="13" width="3"   height="11" rx="0.8" fill="white"/>
          <rect x="3"  y="24" width="22"  height="2"  rx="0.8" fill="white"/>
        </svg>
      </div>
      <span class="header-brand-name">POS Management</span>
      <span class="header-divider">|</span>
      <span class="header-page-title">{{ currentPageTitle }}</span>
    </div>
  </div>

  <div class="header-right">
    <!-- Theme Toggle (Light / Dark Mode) -->
    <button class="icon-btn" (click)="toggleTheme.emit()" id="btn-toggle-theme" [title]="isDarkMode ? 'Chuyển sang Light Mode' : 'Chuyển sang Dark Mode'">
      @if (isDarkMode) {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      } @else {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      }
    </button>

    <!-- Language Selector -->
    <button class="lang-btn icon-btn" (click)="onToggleLanguage()" id="btn-toggle-language" [title]="'HEADER.LANGUAGE' | translate">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      <span>{{ langService.currentLang() === 'vi' ? 'VIE' : 'ENG' }}</span>
    </button>

    <!-- Notification Bell -->
    <button class="icon-btn notification-btn" routerLink="/approval/inbox" id="btn-notifications" [title]="'HEADER.NOTIFICATIONS' | translate">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      @if (notificationCount > 0) {
        <span class="notif-badge">{{ notificationCount > 99 ? '99+' : notificationCount }}</span>
      }
    </button>

    <!-- User Avatar & Dropdown -->
    <div class="user-menu" [class.open]="isUserMenuOpen()">
      <button class="user-btn" (click)="toggleUserMenu()" id="btn-user-menu">
        <div class="avatar">
          <span>{{ userInitials() }}</span>
        </div>
        <div class="user-info">
          <span class="user-name">{{ currentUser?.fullName ?? 'Admin User' }}</span>
          <span class="user-role">{{ currentUser?.roles?.[0] ?? 'SUPER_ADMIN' }}</span>
        </div>
        <svg class="caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      @if (isUserMenuOpen()) {
        <div class="user-dropdown">
          <div class="dropdown-header">
            <div class="avatar avatar-lg"><span>{{ userInitials() }}</span></div>
            <div>
              <p class="dropdown-name">{{ currentUser?.fullName ?? 'Admin User' }}</p>
              <p class="dropdown-email">{{ currentUser?.email ?? 'admin@pos.vn' }}</p>
            </div>
          </div>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" routerLink="/system/profile" (click)="closeUserMenu()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            {{ 'HEADER.PROFILE' | translate }}
          </a>
          <a class="dropdown-item" routerLink="/system/profile" (click)="closeUserMenu()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            {{ 'HEADER.CHANGE_PASSWORD' | translate }}
          </a>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item danger" (click)="onLogout()" id="btn-logout">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            {{ 'HEADER.LOGOUT' | translate }}
          </button>
        </div>
      }
    </div>
  </div>
</header>
